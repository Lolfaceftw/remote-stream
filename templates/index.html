<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Screen Stream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 100vw;
            margin: 0 auto;
            padding: 10px;
            box-sizing: border-box;
        }
        .stream-container {
            width: 100%;
            position: relative;
            background-color: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            min-height: 200px;
        }
        .video-stream {
            width: 100%;
            height: auto;
            display: block;
        }
        .header {
            text-align: center;
            padding: 10px 0;
            margin-bottom: 15px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .quality-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .quality-btn.active {
            background-color: #4CAF50;
        }
        .quality-btn:hover {
            background-color: #444;
        }
        .quality-btn.active:hover {
            background-color: #45a049;
        }
        .status {
            text-align: center;
            padding: 10px;
            background-color: #333;
            border-radius: 4px;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .status.error {
            background-color: #662222;
        }
        .status.connected {
            background-color: #226622;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            color: #ff4444;
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            background-color: rgba(255, 0, 0, 0.1);
        }
        @media (orientation: landscape) {
            .container {
                padding: 0;
            }
            .header {
                display: none;
            }
            .status:not(.error) {
                display: none;
            }
            .stream-container {
                border-radius: 0;
            }
            .controls {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background-color: rgba(0, 0, 0, 0.5);
                padding: 10px;
                border-radius: 20px;
                z-index: 1000;
            }
        }
        /* iOS fullscreen simulation */
        .stream-container.ios-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: #000;
            margin: 0;
            padding: 0;
        }
        
        .stream-container.ios-fullscreen .video-stream {
            height: 100vh;
            object-fit: contain;
            margin: 0;
            padding: 0;
        }
        
        /* Hide browser UI in iOS fullscreen */
        .stream-container.ios-fullscreen .controls {
            bottom: env(safe-area-inset-bottom);
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }

        .fullscreen-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .fullscreen-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Screen Stream</h1>
        </div>
        <div class="controls">
            <button class="quality-btn" data-quality="480p">480p</button>
            <button class="quality-btn active" data-quality="720p">720p</button>
            <button class="quality-btn" data-quality="1080p">1080p</button>
            <button class="fullscreen-btn" id="fullscreenBtn" title="Toggle fullscreen">
                <svg viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>
        </div>
        <div class="stream-container" id="streamContainer">
            <img src="{{ url_for('video_feed') }}" class="video-stream" alt="Screen Stream" style="display: none;">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div>Connecting to stream...</div>
                <div class="error-message" style="display: none;"></div>
            </div>
        </div>
        <div class="status">
            <p>Connecting to stream...</p>
        </div>
    </div>

    <script>
        const videoStream = document.querySelector('.video-stream');
        const loading = document.querySelector('.loading');
        const status = document.querySelector('.status');
        const errorMessage = document.querySelector('.error-message');
        const qualityButtons = document.querySelectorAll('.quality-btn');
        const streamContainer = document.getElementById('streamContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        let reconnectAttempts = 0;
        let statusCheckInterval;
        let currentQuality = '720p';
        
        // Detect iOS
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                     (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        
        let isIOSFullscreen = false;

        // Fullscreen control
        function toggleFullscreen() {
            console.log("Fullscreen toggle initiated");
            
            if (isIOS) {
                // iOS-specific fullscreen handling
                isIOSFullscreen = !isIOSFullscreen;
                if (isIOSFullscreen) {
                    streamContainer.classList.add('ios-fullscreen');
                    document.body.style.overflow = 'hidden';
                    window.scrollTo(0, 0);
                    
                    // Update fullscreen button
                    fullscreenBtn.innerHTML = `
                        <svg viewBox="0 0 24 24">
                            <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
                        </svg>
                    `;
                } else {
                    streamContainer.classList.remove('ios-fullscreen');
                    document.body.style.overflow = '';
                    
                    // Restore fullscreen button
                    fullscreenBtn.innerHTML = `
                        <svg viewBox="0 0 24 24">
                            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                        </svg>
                    `;
                }
                console.log("iOS fullscreen toggled:", isIOSFullscreen);
            } else {
                // Standard fullscreen API for other platforms
                if (!document.fullscreenElement) {
                    console.log("Requesting fullscreen...");
                    streamContainer.requestFullscreen().then(() => {
                        console.log("Fullscreen entered successfully.");
                    }).catch(err => {
                        console.error(`Error attempting to enable fullscreen: ${err.message}`, err);
                        alert(`Fullscreen Error: ${err.message}. Check browser console for details.`);
                    });
                } else {
                    console.log("Exiting fullscreen...");
                    document.exitFullscreen().then(() => {
                        console.log("Fullscreen exited successfully.");
                    }).catch(err => {
                        console.error(`Error attempting to exit fullscreen: ${err.message}`, err);
                        alert(`Error exiting fullscreen: ${err.message}. Check browser console for details.`);
                    });
                }
            }
        }

        // Event listeners for fullscreen
        fullscreenBtn.addEventListener('click', (event) => {
            console.log("Fullscreen button clicked (click event)");
            event.preventDefault();
            toggleFullscreen();
        });

        fullscreenBtn.addEventListener('touchend', (event) => {
            console.log("Fullscreen button touched (touchend event)");
            event.preventDefault();
            toggleFullscreen();
        });

        // Handle iOS orientation changes
        if (isIOS) {
            window.addEventListener('orientationchange', () => {
                if (isIOSFullscreen) {
                    window.scrollTo(0, 0);
                }
            });
        }

        function updateStatus(message, isError = false) {
            status.textContent = message;
            status.className = 'status ' + (isError ? 'error' : 'connected');
            if (isError) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            } else {
                errorMessage.style.display = 'none';
            }
        }

        function checkStreamStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'error') {
                        updateStatus(data.message, true);
                        reconnect();
                    }
                })
                .catch(error => {
                    updateStatus('Connection lost. Retrying...', true);
                    reconnect();
                });
        }

        function setQuality(quality) {
            currentQuality = quality;
            // Update active button
            qualityButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.quality === quality);
            });

            // Update stream with new quality
            fetch(`/set_quality/${quality}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        // Reload the stream with the new quality
                        videoStream.src = `${videoStream.src.split('?')[0]}?quality=${quality}&t=${Date.now()}`;
                        updateStatus(`Quality set to ${quality}`);
                    } else {
                        updateStatus(`Failed to set quality: ${data.message}`, true);
                    }
                })
                .catch(error => {
                    updateStatus('Failed to set quality', true);
                });
        }

        function reconnect() {
            reconnectAttempts++;
            if (reconnectAttempts <= 3) {
                updateStatus(`Reconnecting... Attempt ${reconnectAttempts}/3`, true);
                videoStream.src = `{{ url_for('video_feed') }}?quality=${currentQuality}&t=${Date.now()}`;
            } else {
                updateStatus('Stream connection failed. Please refresh the page.', true);
                clearInterval(statusCheckInterval);
            }
        }

        // Initialize quality buttons
        qualityButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                setQuality(btn.dataset.quality);
            });
        });

        videoStream.onload = function() {
            videoStream.style.display = 'block';
            loading.style.display = 'none';
            updateStatus('Connected to stream');
            reconnectAttempts = 0;
        };

        videoStream.onerror = function() {
            videoStream.style.display = 'none';
            loading.style.display = 'block';
            reconnect();
        };

        // Start status checking
        statusCheckInterval = setInterval(checkStreamStatus, 5000);

        // Initial load
        updateStatus('Connecting to stream...');
    </script>
</body>
</html>
