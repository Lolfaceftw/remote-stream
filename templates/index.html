<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Screen Stream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            position: relative; /* Add this for proper z-index stacking */
        }
        .container {
            width: 100%;
            max-width: 100vw;
            margin: 0 auto;
            padding: 10px;
            box-sizing: border-box;
        }
        .stream-container {
            width: 100%;
            position: relative;
            background-color: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            min-height: 200px;
        }
        .video-stream {
            width: 100%;
            height: auto;
            display: block;
        }
        .header {
            text-align: center;
            padding: 10px 0;
            margin-bottom: 15px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .quality-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .quality-btn.active {
            background-color: #4CAF50;
        }
        .quality-btn:hover {
            background-color: #444;
        }
        .quality-btn.active:hover {
            background-color: #45a049;
        }
        .status {
            text-align: center;
            padding: 10px;
            background-color: #333;
            border-radius: 4px;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .status.error {
            background-color: #662222;
        }
        .status.connected {
            background-color: #226622;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            color: #ff4444;
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            background-color: rgba(255, 0, 0, 0.1);
        }
        @media (orientation: landscape) {
            .container {
                padding: 0;
            }
            .header {
                display: none;
            }
            .status:not(.error) {
                display: none;
            }
            .stream-container {
                border-radius: 0;
            }
            .controls {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background-color: rgba(0, 0, 0, 0.5);
                padding: 10px;
                border-radius: 20px;
                z-index: 1000;
            }
        }
        /* iOS fullscreen simulation */
        .stream-container.ios-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: transparent; /* Changed from black to transparent to show the background */
            margin: 0;
            padding: 0;
        }
        
        .stream-container.ios-fullscreen .video-stream {
            height: 100vh;
            object-fit: contain;
            margin: 0;
            padding: 0;
            position: relative;
            z-index: 2;
            background-color: transparent; /* Added to ensure transparency */
        }
        
        /* Ambient background effect */
        #ambientBackground {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            transform: scale(1.2);
            filter: blur(30px) brightness(0.5);
            object-fit: cover;
            opacity: 0.7;
            pointer-events: none;
            display: none;
        }
        
        /* Explicitly show ambient background when body has this class */
        body.ios-fullscreen-active #ambientBackground {
            display: block !important;
        }
        
        /* iOS fullscreen controls */
        #ios-fullscreen-controls {
            display: none; /* Hidden by default */
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            z-index: 10000;
            flex-direction: row;
            gap: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Show iOS controls when in fullscreen */
        body.ios-fullscreen-active #ios-fullscreen-controls {
            display: flex !important;
        }

        .fullscreen-btn {
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            border-radius: 4px;
            min-width: 44px; /* Better touch target */
            min-height: 44px; /* Better touch target */
        }

        .fullscreen-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        
        /* Debug helper */
        .debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 4px;
            font-size: 10px;
            z-index: 10001;
            max-width: 300px;
            word-break: break-all;
            display: none;
        }
        
        body.ios-fullscreen-active .debug-info {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Debug info -->
    <div class="debug-info" id="debugInfo">Debug info will appear here</div>

    <div class="container">
        <div class="header">
            <h1>Screen Stream</h1>
        </div>
        <div class="controls">
            <button class="quality-btn" data-quality="480p">480p</button>
            <button class="quality-btn active" data-quality="720p">720p</button>
            <button class="quality-btn" data-quality="1080p">1080p</button>
            <button class="fullscreen-btn" id="fullscreenBtn" title="Toggle fullscreen">
                <svg viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>
        </div>
        <div class="stream-container" id="streamContainer">
            <img src="{{ url_for('video_feed') }}" class="video-stream" alt="Screen Stream" style="display: none;">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div>Connecting to stream...</div>
                <div class="error-message" style="display: none;"></div>
            </div>
        </div>
        <div class="status">
            <p>Connecting to stream...</p>
        </div>
    </div>

    <!-- Ambient background for fullscreen mode -->
    <img id="ambientBackground" alt="Ambient Background">

    <!-- iOS fullscreen controls that appear when in fullscreen mode -->
    <div id="ios-fullscreen-controls">
        <button class="quality-btn" data-quality="480p">480p</button>
        <button class="quality-btn active" data-quality="720p">720p</button>
        <button class="quality-btn" data-quality="1080p">1080p</button>
        <button class="fullscreen-btn" id="exitFullscreenBtn" title="Exit fullscreen">
            <svg viewBox="0 0 24 24">
                <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
            </svg>
        </button>
    </div>

    <script>
        const videoStream = document.querySelector('.video-stream');
        const loading = document.querySelector('.loading');
        const status = document.querySelector('.status');
        const errorMessage = document.querySelector('.error-message');
        const qualityButtons = document.querySelectorAll('.quality-btn');
        const streamContainer = document.getElementById('streamContainer');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
        const iosFullscreenControls = document.getElementById('ios-fullscreen-controls');
        const ambientBackground = document.getElementById('ambientBackground');
        const debugInfo = document.getElementById('debugInfo');
        let reconnectAttempts = 0;
        let statusCheckInterval;
        let ambientUpdateInterval;
        let currentQuality = '720p';
        
        // Detect iOS
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                     (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        
        let isIOSFullscreen = false;

        // Debug function
        function updateDebugInfo(info) {
            if (debugInfo) {
                const now = new Date();
                const timestamp = `${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}`;
                debugInfo.innerHTML = `${timestamp}: ${info}<br>` + debugInfo.innerHTML.slice(0, 500);
            }
        }

        // Show video stream when it loads
        videoStream.addEventListener('load', function() {
            videoStream.style.display = 'block';
            loading.style.display = 'none';
            updateStatus('Connected');
            
            updateDebugInfo(`Stream loaded. Initializing ambient background.`);
            // Call updateAmbientBackground to use the canvas method for the first frame.
            updateAmbientBackground();
        });

        // Update ambient background periodically to match current frame
        function updateAmbientBackground() {
            try {
                updateDebugInfo("Updating ambient background using canvas method");
                
                // Always try canvas method if video stream is ready
                if (videoStream.complete && (videoStream.naturalWidth || videoStream.width)) {
                    updateDebugInfo(`Canvas attempt. naturalWidth: ${videoStream.naturalWidth}, width: ${videoStream.width}`);
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    canvas.width = videoStream.naturalWidth || videoStream.width;
                    canvas.height = videoStream.naturalHeight || videoStream.height;
                    
                    ctx.drawImage(videoStream, 0, 0, canvas.width, canvas.height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
                    ambientBackground.src = dataUrl;
                    updateDebugInfo(`Ambient background updated with canvas: ${dataUrl.slice(0, 40)}...`);

                    // Ensure it's displayed if it was previously none and should be visible
                    if (document.body.classList.contains('ios-fullscreen-active') && getComputedStyle(ambientBackground).display === 'none') {
                        ambientBackground.style.display = 'block'; // Should be handled by CSS, but as a safeguard
                        updateDebugInfo("Forced ambient background display to block as it was none and body has ios-fullscreen-active.");
                    }
                } else {
                    updateDebugInfo("Video stream not complete or has no dimensions for canvas method.");
                    // Consider clearing ambientBackground.src or setting a placeholder if desired
                    // ambientBackground.src = ''; 
                }
            } catch (e) {
                updateDebugInfo(`Error in updateAmbientBackground: ${e.message}`);
                // Consider clearing ambientBackground.src or setting a placeholder
                // ambientBackground.src = ''; 
            }
        }

        // Fullscreen control
        function toggleFullscreen() {
            updateDebugInfo("Fullscreen toggle initiated");
            
            if (isIOS) {
                isIOSFullscreen = !isIOSFullscreen;
                if (isIOSFullscreen) {
                    streamContainer.classList.add('ios-fullscreen');
                    document.body.classList.add('ios-fullscreen-active'); // This class makes ambientBackground display: block !important
                    document.body.style.overflow = 'hidden';
                    window.scrollTo(0, 0);
                    
                    updateDebugInfo("Initializing ambient background for iOS fullscreen");
                    updateAmbientBackground(); // Initial update using canvas
                    
                    syncQualityButtons();
                    
                    if (ambientUpdateInterval) clearInterval(ambientUpdateInterval);
                    ambientUpdateInterval = setInterval(updateAmbientBackground, 2000);
                    
                    setTimeout(updateAmbientBackground, 100); // Extra update soon after transition
                    
                } else {
                    streamContainer.classList.remove('ios-fullscreen');
                    document.body.classList.remove('ios-fullscreen-active'); // This class hides ambientBackground
                    document.body.style.overflow = '';
                    
                    if (ambientUpdateInterval) {
                        clearInterval(ambientUpdateInterval);
                        ambientUpdateInterval = null;
                    }
                    // ambientBackground.style.display = 'none'; // CSS handles this
                    updateDebugInfo("Exited iOS fullscreen");
                }
                updateDebugInfo(`iOS fullscreen toggled: ${isIOSFullscreen}`);
            } else {
                // Standard fullscreen API for other platforms
                if (!document.fullscreenElement) {
                    updateDebugInfo("Requesting standard fullscreen");
                    streamContainer.requestFullscreen().then(() => {
                        updateDebugInfo("Fullscreen entered successfully");
                        document.body.classList.add('ios-fullscreen-active'); // Show ambient
                        updateAmbientBackground(); // Initial update
                        if (ambientUpdateInterval) clearInterval(ambientUpdateInterval);
                        ambientUpdateInterval = setInterval(updateAmbientBackground, 2000);
                        setTimeout(updateAmbientBackground, 100); // Extra update
                    }).catch(err => {
                        updateDebugInfo(`Fullscreen error: ${err.message}`);
                        console.error(`Error attempting to enable fullscreen: ${err.message}`, err);
                    });
                } else {
                    updateDebugInfo("Exiting standard fullscreen");
                    document.exitFullscreen().then(() => {
                        updateDebugInfo("Fullscreen exited successfully");
                        document.body.classList.remove('ios-fullscreen-active'); // Hide ambient
                        // ambientBackground.style.display = 'none'; // CSS handles
                        if (ambientUpdateInterval) {
                            clearInterval(ambientUpdateInterval);
                            ambientUpdateInterval = null;
                        }
                    }).catch(err => {
                        updateDebugInfo(`Exit fullscreen error: ${err.message}`);
                        console.error(`Error attempting to exit fullscreen: ${err.message}`, err);
                    });
                }
            }
        }

        // Sync the active quality button between the main controls and iOS fullscreen controls
        function syncQualityButtons() {
            const allButtons = document.querySelectorAll('.quality-btn');
            allButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.quality === currentQuality);
            });
        }

        // Event listeners for fullscreen
        fullscreenBtn.addEventListener('click', (event) => {
            event.preventDefault();
            toggleFullscreen();
        });

        fullscreenBtn.addEventListener('touchend', (event) => {
            event.preventDefault();
            toggleFullscreen();
        });

        // Exit fullscreen button in iOS fullscreen controls
        exitFullscreenBtn.addEventListener('click', (event) => {
            event.preventDefault();
            toggleFullscreen();
        });

        exitFullscreenBtn.addEventListener('touchend', (event) => {
            event.preventDefault();
            toggleFullscreen();
        });

        // Handle iOS orientation changes
        if (isIOS) {
            window.addEventListener('orientationchange', () => {
                if (isIOSFullscreen) {
                    window.scrollTo(0, 0);
                }
            });
        }

        function updateStatus(message, isError = false) {
            status.textContent = message;
            status.className = 'status ' + (isError ? 'error' : 'connected');
            if (isError) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            } else {
                errorMessage.style.display = 'none';
            }
        }

        function checkStreamStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'error') {
                        updateStatus(data.message, true);
                        reconnect();
                    }
                })
                .catch(error => {
                    updateStatus('Connection lost. Retrying...', true);
                    reconnect();
                });
        }

        function setQuality(quality) {
            currentQuality = quality;
            
            // Update all quality buttons (both in main controls and fullscreen controls)
            syncQualityButtons();

            // Update stream with new quality
            updateStatus(`Setting quality to ${quality}...`);
            fetch(`/set_quality/${quality}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Server returned ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'success') {
                        updateStatus(`Quality set to ${quality}`);
                    } else {
                        updateStatus(`Failed to set quality: ${data.message}`, true);
                    }
                })
                .catch(error => {
                    console.error("Quality setting error:", error);
                    updateStatus(`Failed to set quality: ${error.message}`, true);
                });
        }

        function reconnect() {
            reconnectAttempts++;
            if (reconnectAttempts <= 3) {
                updateStatus(`Reconnecting... Attempt ${reconnectAttempts}/3`, true);
                videoStream.src = `{{ url_for('video_feed') }}?t=${Date.now()}`;
            } else {
                updateStatus('Stream connection failed. Please refresh the page.', true);
                clearInterval(statusCheckInterval);
            }
        }

        // Initialize all quality buttons
        document.querySelectorAll('.quality-btn').forEach(btn => {
            btn.addEventListener('click', (event) => {
                event.preventDefault();
                setQuality(btn.dataset.quality);
            });
            
            btn.addEventListener('touchend', (event) => {
                event.preventDefault();
                setQuality(btn.dataset.quality);
            });
        });

        // Start status monitoring
        statusCheckInterval = setInterval(checkStreamStatus, 3000);
        
        // Load initial quality from server
        fetch('/get_quality')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    currentQuality = data.quality;
                    syncQualityButtons();
                }
            })
            .catch(error => {
                console.error("Error getting initial quality:", error);
            });
            
        // Manual force update for ambient background
        document.addEventListener('click', () => {
            if (isIOSFullscreen) {
                updateDebugInfo("Document clicked, forcing ambient background update");
                updateAmbientBackground();
                ambientBackground.style.display = 'block';
            }
        });
    </script>
</body>
</html>
