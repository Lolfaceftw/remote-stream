<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Stream</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 100vw;
            margin: 0 auto;
            padding: 10px;
            box-sizing: border-box;
        }
        .stream-container {
            width: 100%;
            position: relative;
            background-color: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            min-height: 200px;
        }
        .video-stream {
            width: 100%;
            height: auto;
            display: block;
        }
        .header {
            text-align: center;
            padding: 10px 0;
            margin-bottom: 15px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .quality-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .quality-btn.active {
            background-color: #4CAF50;
        }
        .quality-btn:hover {
            background-color: #444;
        }
        .quality-btn.active:hover {
            background-color: #45a049;
        }
        .status {
            text-align: center;
            padding: 10px;
            background-color: #333;
            border-radius: 4px;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .status.error {
            background-color: #662222;
        }
        .status.connected {
            background-color: #226622;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            color: #ff4444;
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            background-color: rgba(255, 0, 0, 0.1);
        }
        @media (orientation: landscape) {
            .container {
                padding: 0;
            }
            .header {
                display: none;
            }
            .status:not(.error) {
                display: none;
            }
            .stream-container {
                border-radius: 0;
            }
            .controls {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background-color: rgba(0, 0, 0, 0.5);
                padding: 10px;
                border-radius: 20px;
                z-index: 1000;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Screen Stream</h1>
        </div>
        <div class="controls">
            <button class="quality-btn" data-quality="480p">480p</button>
            <button class="quality-btn active" data-quality="720p">720p</button>
            <button class="quality-btn" data-quality="1080p">1080p</button>
        </div>
        <div class="stream-container">
            <img src="{{ url_for('video_feed') }}" class="video-stream" alt="Screen Stream" style="display: none;">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div>Connecting to stream...</div>
                <div class="error-message" style="display: none;"></div>
            </div>
        </div>
        <div class="status">
            <p>Connecting to stream...</p>
        </div>
    </div>

    <script>
        const videoStream = document.querySelector('.video-stream');
        const loading = document.querySelector('.loading');
        const status = document.querySelector('.status');
        const errorMessage = document.querySelector('.error-message');
        const qualityButtons = document.querySelectorAll('.quality-btn');
        let reconnectAttempts = 0;
        let statusCheckInterval;
        let currentQuality = '720p';

        function updateStatus(message, isError = false) {
            status.textContent = message;
            status.className = 'status ' + (isError ? 'error' : 'connected');
            if (isError) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            } else {
                errorMessage.style.display = 'none';
            }
        }

        function checkStreamStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'error') {
                        updateStatus(data.message, true);
                        reconnect();
                    }
                })
                .catch(error => {
                    updateStatus('Connection lost. Retrying...', true);
                    reconnect();
                });
        }

        function setQuality(quality) {
            currentQuality = quality;
            // Update active button
            qualityButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.quality === quality);
            });

            // Update stream with new quality
            fetch(`/set_quality/${quality}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        // Reload the stream with the new quality
                        videoStream.src = `${videoStream.src.split('?')[0]}?quality=${quality}&t=${Date.now()}`;
                        updateStatus(`Quality set to ${quality}`);
                    } else {
                        updateStatus(`Failed to set quality: ${data.message}`, true);
                    }
                })
                .catch(error => {
                    updateStatus('Failed to set quality', true);
                });
        }

        function reconnect() {
            reconnectAttempts++;
            if (reconnectAttempts <= 3) {
                updateStatus(`Reconnecting... Attempt ${reconnectAttempts}/3`, true);
                videoStream.src = `{{ url_for('video_feed') }}?quality=${currentQuality}&t=${Date.now()}`;
            } else {
                updateStatus('Stream connection failed. Please refresh the page.', true);
                clearInterval(statusCheckInterval);
            }
        }

        // Initialize quality buttons
        qualityButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                setQuality(btn.dataset.quality);
            });
        });

        videoStream.onload = function() {
            videoStream.style.display = 'block';
            loading.style.display = 'none';
            updateStatus('Connected to stream');
            reconnectAttempts = 0;
        };

        videoStream.onerror = function() {
            videoStream.style.display = 'none';
            loading.style.display = 'block';
            reconnect();
        };

        // Start status checking
        statusCheckInterval = setInterval(checkStreamStatus, 5000);

        // Initial load
        updateStatus('Connecting to stream...');
    </script>
</body>
</html>
