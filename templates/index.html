<!DOCTYPE html>
<html>
<head>
    <title>Screen Stream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }
        .stream-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .stream {
            width: 100%;
            height: auto;
            display: block;
        }
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .stream-container:hover .controls,
        .stream-container.fullscreen .controls:hover {
            opacity: 1;
        }
        .quality-controls {
            display: flex;
            gap: 10px;
        }
        .control-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        .control-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .control-btn.active {
            background: #007bff;
        }
        .fullscreen-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .fullscreen-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        .status {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.6);
            border-radius: 4px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .stream-container:hover .status {
            opacity: 1;
        }
        /* Fullscreen styles */
        .stream-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            border-radius: 0;
        }
        .stream-container.fullscreen .stream {
            height: 100vh;
            object-fit: contain;
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .control-btn {
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stream-container" id="streamContainer">
            <img src="{{ url_for('video_feed') }}" class="stream" id="stream">
            <div class="controls">
                <div class="quality-controls">
                    <button class="control-btn" data-quality="480p">480p</button>
                    <button class="control-btn active" data-quality="720p">720p</button>
                    <button class="control-btn" data-quality="1080p">1080p</button>
                </div>
                <button class="fullscreen-btn" id="fullscreenBtn" title="Toggle fullscreen" ontouchend="javascript:console.log('Inline ontouchend fired!'); alert('Inline ontouchend!');">
                    <svg viewBox="0 0 24 24" class="fullscreen-icon">
                        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                    </svg>
                </button>
            </div>
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const qualityBtns = document.querySelectorAll('.control-btn');
            const streamContainer = document.getElementById('streamContainer');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const statusElement = document.getElementById('status');
            let currentQuality = '720p';

            // Quality control
            qualityBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const quality = this.dataset.quality;
                    fetch(`/set_quality/${quality}`)
                        .then(response => response.json())
                        .then(data => {
                            if (data.status === 'success') {
                                qualityBtns.forEach(b => b.classList.remove('active'));
                                this.classList.add('active');
                                currentQuality = quality;
                            }
                        });
                });
            });

            // Fullscreen control
            function મોબાઇલ_ફુલસ્ક્રીન_ટેસ્ટ() {
                console.log(" મોબાઇલ_ફુલસ્ક્રીન_ટેસ્ટ function called by tap/click.");
                alert("મોબાઇલ_ફુલસ્ક્રીન_ટેસ્ટ function executed!");
                
                toggleFullscreen(); 
            }

            function toggleFullscreen() {
                console.log("Fullscreen toggle initiated");
                if (!document.fullscreenElement) {
                    console.log("Requesting fullscreen...");
                    streamContainer.requestFullscreen().then(() => {
                        console.log("Fullscreen entered successfully.");
                    }).catch(err => {
                        console.error(`Error attempting to enable fullscreen: ${err.message}`, err);
                        alert(`Fullscreen Error: ${err.message}. Check browser console for details.`);
                    });
                } else {
                    console.log("Exiting fullscreen...");
                    document.exitFullscreen().then(() => {
                        console.log("Fullscreen exited successfully.");
                    }).catch(err => {
                        console.error(`Error attempting to exit fullscreen: ${err.message}`, err);
                        alert(`Error exiting fullscreen: ${err.message}. Check browser console for details.`);
                    });
                }
            }

            fullscreenBtn.addEventListener('click', () => {
                console.log("Fullscreen button clicked (click event)");
                toggleFullscreen();
            });

            fullscreenBtn.addEventListener('touchend', (event) => {
                console.log("Fullscreen button touched (touchend event)");
                event.preventDefault(); // Prevent firing click event as well on some devices
                toggleFullscreen();
            });

            // Update fullscreen button icon on fullscreen change
            document.addEventListener('fullscreenchange', () => {
                console.log("Fullscreen state changed. Current fullscreen element:", document.fullscreenElement);
                if (document.fullscreenElement) {
                    streamContainer.classList.add('fullscreen');
                    fullscreenBtn.innerHTML = `
                        <svg viewBox="0 0 24 24">
                            <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
                        </svg>
                    `;
                    console.log("Applied fullscreen styles and icon.");
                } else {
                    streamContainer.classList.remove('fullscreen');
                    fullscreenBtn.innerHTML = `
                        <svg viewBox="0 0 24 24">
                            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                        </svg>
                    `;
                    console.log("Removed fullscreen styles and restored icon.");
                }
            });

            // Status monitoring
            function updateStatus() {
                fetch('/status')
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'ok') {
                            statusElement.textContent = `Latency: ${data.latency}ms | Quality: ${currentQuality}`;
                            statusElement.style.color = '#4CAF50';
                        } else {
                            statusElement.textContent = data.message;
                            statusElement.style.color = '#f44336';
                        }
                    })
                    .catch(error => {
                        statusElement.textContent = 'Connection error';
                        statusElement.style.color = '#f44336';
                    });
            }

            // Update status every second
            setInterval(updateStatus, 1000);
            updateStatus();

            // For extreme debugging, attach to window to see if *any* touchend is registered
            window.addEventListener('touchend', function(event) {
                console.log('Window touchend event:', event.target);
            }, true); // Use capture phase
        });
    </script>
</body>
</html>
